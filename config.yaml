# Konfiguration für EA FC27 WebApp Bot

mode: browser
# headless: false = Browser läuft im Xvfb mit vollem UI-Support (EMPFOHLEN)
# headless: true = Browser im reinen Headless-Modus
headless: false
test_mode: false  # false = 24/7 Dauerbetrieb (Scheduler), true = Einmaliger Testlauf

# Discord Webhook für Benachrichtigungen (optional)
# Hier deine Discord Webhook URL einfügen, z.B. "https://discord.com/api/webhooks/..."
discord_webhook: ""

# EA WebApp URL (Offizielle EA Sports FC WebApp)
login_url: "https://www.ea.com/ea-sports-fc/ultimate-team/web-app/"

# Benutzeranmeldedaten (können auch via .env Datei gesetzt werden: EA_USERNAME / EA_PASSWORD)
username: ""
password: ""

# UI Selektoren
ui_selectors:
  # ===== Login Selektoren =====
  primary_login_button: "button.btn-standard.call-to-action, button.btn-standard.primary, button.ut-login-button"
  username: "input[name='email']"
  password: "input[name='password']"
  next_button: "a#logInBtn"
  sign_in_button: "a#logInBtn"
  
  # ===== Transfer List Navigation =====
  transfer_tab: "button.ut-tab-bar-item.icon-transfer"
  transfer_tile: ".tile.col-1-2.ut-tile-transfer-list.ut-tile-transfers"
  
  # ===== Re-List Selektoren =====
  transfer_list_items: "div.rowContent.has-tap-callback"  # Alle Items auf der Transferliste
  player_name: "div.name"                                  # Spielername innerhalb eines Items
  relist_all_button: "button.btn-standard.section-header-btn.mini.primary"  # "Re-list All" Button
  confirm_yes_button: "button.btn-standard.primary"  # "Yes" Bestätigungsbutton
  
  # ===== Autobuyer Selektoren (für später) =====
  search_tab: "PLACEHOLDER"
  search_input: "PLACEHOLDER"
  search_button: "PLACEHOLDER"
  min_buy_button: "PLACEHOLDER"
  max_buy_button: "PLACEHOLDER"

  max_bid_button: "PLACEHOLDER"
  min_bid_button: "PLACEHOLDER"

# Zeitplan für automatische Ausführung
schedule:
  type: interval
  hours: 1  # Alle 1 Stunde


